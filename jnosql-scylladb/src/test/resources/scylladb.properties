jnosql.scylladb.host.1=localhost
jnosql.scylladb.port=9142
jnosql.scylladb.query.1=CREATE KEYSPACE IF NOT EXISTS newKeySpace WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor' : 1};
jnosql.scylladb.query.2=CREATE TYPE IF NOT EXISTS newKeySpace.fullname ( firstname text, lastname text);
jnosql.scylladb.query.3=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.newColumnFamily (id bigint PRIMARY KEY, version double, options list<int>, name text);
jnosql.scylladb.query.4=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.users ( nickname text PRIMARY KEY, name frozen <fullname>);
jnosql.scylladb.query.5=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.history ( name text PRIMARY KEY, "dataStart" date, "dateEnd" timestamp);
jnosql.scylladb.query.6=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.contacts ( user text PRIMARY KEY, names list<frozen <fullname>>);
jnosql.scylladb.query.7=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.agenda ( user text PRIMARY KEY, names set<frozen <fullname>>);
jnosql.scylladb.query.8=CREATE COLUMNFAMILY IF NOT EXISTS newKeySpace.contact ( id bigint PRIMARY KEY, name text);